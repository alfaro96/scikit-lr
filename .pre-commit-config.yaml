repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  - repo: https://github.com/facebook/pyrefly-pre-commit
    rev: 1.3.2
    hooks:
      - id: pyrefly-check
        # Already the language of the hook, but Renovate only updates the
        # additional_dependencies of the hooks that declare it here
        language: python
        # The hook runs in an isolated environment, so install the
        # imported packages to type check against their annotations
        additional_dependencies:
          - numpy==2.5.3
          - scipy==1.18.1
          - scikit-learn==1.9.1
          - pytest==9.1.1

  - repo: https://github.com/MarcoGorelli/cython-lint
    rev: v0.21.1
    hooks:
      - id: cython-lint
      - id: double-quote-cython-strings

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: local
    hooks:
      # The private API of scikit-learn, its modules and names, may change
      # without deprecation, so it is only imported from a single
      # compatibility module
      - id: no-private-sklearn-imports
        name: private scikit-learn imports only in sklr/utils/_sklearn_compat.py
        language: python
        entry: python build_tools/check_private_sklearn_imports.py
        types: [python]
        exclude: ^sklr/utils/_sklearn_compat\.py$

      # The versions of some packages, and the supported Python versions, are
      # declared in several files, which are checked against each other to
      # keep them from drifting apart
      - id: check-versions
        name: versions in sync across pyproject.toml, environment.yml, the hooks, the workflows and Renovate
        language: python
        entry: python build_tools/check_versions.py
        additional_dependencies: [packaging==26.3, pyyaml==6.0.3]
        files: ^(environment\.yml|pyproject\.toml|\.pre-commit-config\.yaml|\.github/workflows/.*\.yml|\.github/renovate\.json|build_tools/check_versions\.py)$
        pass_filenames: false
