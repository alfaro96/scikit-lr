repos:
  # Generic file checks: large files, merge conflict markers, valid TOML and
  # YAML, final newline and trailing whitespace
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Lint and format the Python code
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9  # Keep in sync with the ruff version in environment.yml
    hooks:
      - id: ruff-check
        args: ["--fix", "--show-fixes"]
      - id: ruff-format

  # Lint the Cython code and normalize its string quotes
  - repo: https://github.com/MarcoGorelli/cython-lint
    rev: v0.21.1  # Configuration in pyproject.toml
    hooks:
      - id: cython-lint
        args: ["--ban-relative-imports"]  # Same as ruff for Python files
      - id: double-quote-cython-strings  # Same quotes as ruff format for Python files

  # Find common misspellings in code, comments and documentation
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3  # Configuration in pyproject.toml
    hooks:
      - id: codespell

  # Checks specific to this project
  - repo: local
    hooks:
      # Private scikit-learn modules may change without deprecation, so
      # they are only imported from a single compatibility module
      - id: no-private-sklearn-imports
        name: private scikit-learn imports only in sklr/utils/_sklearn_compat.py
        language: pygrep
        entry: '^\s*(from|import)\s+sklearn(\.\w+)*\._'
        types: [python]
        exclude: ^sklr/utils/_sklearn_compat\.py$
