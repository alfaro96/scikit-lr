[project]
name = "scikit-lr"
dynamic = ["version"]
description = "Label ranking and partial label ranking with scikit-learn compatible estimators"
authors = [
    {name = "Juan Carlos Alfaro Jiménez", email = "JuanCarlos.Alfaro@uclm.es"},
]
maintainers = [
    {name = "Juan Carlos Alfaro Jiménez", email = "JuanCarlos.Alfaro@uclm.es"},
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "scikit-learn~=1.9.0",  # Same range as in [build-system]: the cimported Cython ABI may change between minor releases
]
license = "MIT"
license-files = ["COPYING"]
keywords = ["label ranking", "partial label ranking", "machine learning", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Programming Language :: C",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
homepage = "https://scikit-lr.readthedocs.io"
source = "https://github.com/alfaro96/scikit-lr"
download = "https://pypi.org/project/scikit-lr/#files"
tracker = "https://github.com/alfaro96/scikit-lr/issues"

[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.17.1",
    "cython>=3.1.2",
    "numpy>=2",  # Extensions built against NumPy 2 also work with the older runtime NumPy versions
    "scikit-learn~=1.9.0",  # Same range as the runtime dependency
]

[tool.pytest.ini_options]
testpaths = ["sklr"]
addopts = [
    "--import-mode=importlib",  # Do not prepend test directories to sys.path, so the installed sklr is tested
    "--strict-config",  # Fail on unknown keys in this section
    "--strict-markers",  # Fail on markers that are not registered
    "--doctest-modules",  # Also run the examples in the docstrings
    "-ra",  # Report the reason of every test that does not pass (skipped, xfailed, xpassed, failed, error)
]
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"  # Ignore whitespace differences and let "..." match any output
xfail_strict = true  # An expected failure that passes is an error, so stale "expected_failed_checks" are noticed
filterwarnings = [
    "error",  # Every warning is an error; add exceptions only for specific, documented third-party warnings
]

[tool.ruff]
line-length = 88
extend-exclude = [
    "build",  # Build directory of meson-python, not excluded by default
    "doc/auto_examples",  # Generated by sphinx-gallery
    "doc/modules/generated",  # Generated by autosummary
]

[tool.ruff.lint]
preview = true  # Needed by CPY001
explicit-preview-rules = true  # Only enable the preview rules selected by their full code
extend-select = [
    "E501",  # Line too long
    "W",  # pycodestyle warnings
    "I",  # isort
    "UP",  # pyupgrade
    "NPY",  # NumPy-specific rules
    "CPY001",  # Missing copyright notice
    "PGH",  # pygrep-hooks
    "RUF",  # Ruff-specific rules
    "TID252",  # Relative imports
]
ignore = [
    "E731",  # Lambda expression assigned to a variable
    "E741",  # Ambiguous variable name
    "RUF002",  # Ambiguous Unicode character in a docstring, where math symbols are needed
    "RUF003",  # Ambiguous Unicode character in a comment, where math symbols are needed
    "RUF012",  # Mutable class attribute without ClassVar, idiomatic in scikit-learn estimators
    "W191",  # Conflicts with the formatter
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = '# Authors: The scikit-lr developers\r?\n# SPDX-License-Identifier: MIT'
min-file-size = 1  # Empty files do not need the notice

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]  # Gallery examples have code before the imports
"doc/conf.py" = ["E402"]  # The Sphinx configuration runs setup code before some imports

[tool.cython-lint]
# Same codes as ruff, plus E501 because keeping Cython lines under 88
# characters often makes the code less readable
ignore = [
    "E24",  # Multiple spaces or tab after comma
    "E501",  # Line too long
    "E731",  # Lambda expression assigned to a variable
    "E741",  # Ambiguous variable name
    "W503",  # Line break before binary operator
    "W504",  # Line break after binary operator
]

[tool.codespell]
skip = ["./.git", "./build", "./doc/_build", "./doc/auto_examples", "./doc/modules/generated"]
