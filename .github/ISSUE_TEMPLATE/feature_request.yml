name: Feature request
description: Suggest a new estimator or metric, or an improvement to an existing one.
labels: [feature]

body:
  - type: textarea
    attributes:
      label: Describe the workflow you want to enable
      description: The problem that the feature solves, and how you would use it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe your proposed solution
      description: >
        How the feature would work. For a new estimator or metric, cite the article that describes it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Describe alternatives you have considered
  - type: textarea
    attributes:
      label: Additional context
