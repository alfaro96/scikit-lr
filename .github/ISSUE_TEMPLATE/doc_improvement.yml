name: Documentation improvement
description: Report a problem in the documentation. A small fix can also be submitted directly as a pull request.
labels: [documentation]

body:
  - type: textarea
    attributes:
      label: Describe the problem in the documentation
      description: The page or docstring, and what is wrong, missing or confusing in it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Suggest an improvement
      description: How the documentation could be fixed or improved.
