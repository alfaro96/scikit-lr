# Report the changes to the supported versions of Python, NumPy, SciPy and
# scikit-learn that are due
name: Supported versions

# The supported versions of Python, NumPy and SciPy follow SPEC 0, and scikit-lr
# is built against a single minor release of scikit-learn, so the supported
# versions change with the releases of these projects, which nothing else in the
# repository notices while the tests pass. A run every week checks their
# releases, and keeps an issue with what is due: a new minor release of
# scikit-learn, a new Python version with wheels of the dependencies, or minimum
# versions that can be raised. The issue is commented when what is due changes,
# since editing it notifies nobody, and closed once there is nothing left. The
# runs of the pull requests that change the workflow or its scripts check them
# before they reach master, where the schedule runs, and only show the report
on:
  schedule:
    # Every Monday
    - cron: "0 8 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/supported-versions.yml
      - build_tools/github/check_supported_versions.py
      - build_tools/github/check_supported_versions.sh
      - build_tools/github/update_supported_versions_issue.sh

permissions:
  contents: read

concurrency:
  # The runs of a pull request share a group, named after its number, which
  # unlike its branch name is not shared with pull requests from other forks,
  # while every other run gets its own, so only the outdated runs of a pull
  # request are cancelled
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check-supported-versions:
    name: Check the supported versions
    runs-on: ubuntu-latest
    # Skip the runs in forks, whose changes are checked here
    # when they open a pull request
    if: github.repository == 'alfaro96/scikit-lr'

    outputs:
      report: ${{ steps.report.outputs.report }}

    steps:
      - name: Checkout scikit-lr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # Minimum supported version, checked by build_tools/check_versions.py
          python-version: "3.13"

      - name: Report the supported versions to update
        id: report
        run: bash build_tools/github/check_supported_versions.sh

  update-issue:
    name: Update the issue
    needs: check-supported-versions
    runs-on: ubuntu-latest
    # Only the scheduled and manual runs, which check master or the branch
    # chosen by hand, report to the issue
    if: >-
      github.repository == 'alfaro96/scikit-lr' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    permissions:
      # Open, edit and close the issue with the token of the job
      issues: write

    steps:
      - name: Checkout scikit-lr
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open, update or close the issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          LABEL: dependencies
          REPORT: ${{ needs.check-supported-versions.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: bash build_tools/github/update_supported_versions_issue.sh
