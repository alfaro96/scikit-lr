name: scikit-lr
channels:
  - conda-forge
dependencies:
  - python=3.13  # Develop against the minimum supported version
  # Runtime
  - numpy>=2.2
  - scipy>=1.15
  - scikit-learn~=1.9.0
  # Build
  - c-compiler
  - cxx-compiler
  - cython>=3.1.2
  - meson
  - meson-python>=0.17.1
  - ninja
  # Test
  - pytest
  # Lint
  - pre-commit
  - pyrefly=1.3.2
  - ruff=0.16.9
