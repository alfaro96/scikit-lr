name: scikit-lr
channels:
  - conda-forge
dependencies:
  - python=3.13  # Develop against the minimum supported version
  # Runtime, with the same ranges as in pyproject.toml
  - numpy>=2.2
  - scipy>=1.15
  - scikit-learn=1.9
  # Build
  - c-compiler
  - cxx-compiler
  - cython>=3.1.2
  - meson
  - meson-python>=0.17.1
  - ninja
  # Test
  - pytest
  # Lint
  - pre-commit
  - pyrefly=1.3.2  # Keep in sync with the pyrefly version in .pre-commit-config.yaml
  - ruff=0.16.9  # Keep in sync with the ruff version in .pre-commit-config.yaml
